# Só configuração de ferramentas; as dependências ficam em requirements*.txt (versões fixas).

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integracao: precisa de Postgres (TEST_ADMIN_DATABASE_URL)"]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]
