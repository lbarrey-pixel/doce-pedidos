[alembic]
script_location = migrations
# A URL vem de MIGRATIONS_DATABASE_URL (dono do schema, nunca o papel doce_api).

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)s %(message)s
